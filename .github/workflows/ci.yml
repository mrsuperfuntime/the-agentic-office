name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for disallowed default secrets
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          allowlist = {
              ".env.example",
          }
          patterns = {
              r"agentic-office-dev-key": "Default orchestrator key should not appear in tracked runtime files",
              r"admin:admin": "Default admin/admin credentials are not allowed",
              r"POSTGRES_PASSWORD\s*[:=]\s*admin": "Default postgres password is not allowed",
              r"RABBITMQ_DEFAULT_PASS\s*[:=]\s*admin": "Default rabbitmq password is not allowed",
          }

          violations = []
          for rel in files:
              if rel in allowlist:
                  continue
              path = pathlib.Path(rel)
              if path.suffix.lower() not in {".py", ".yml", ".yaml", ".md", ".txt", ".env", ".example", ".html", ".json"}:
                  continue
              try:
                  content = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue

              for pattern, reason in patterns.items():
                  if re.search(pattern, content):
                      violations.append(f"{rel}: {reason} ({pattern})")

          if violations:
              print("Secret pattern scan failed:")
              for entry in violations:
                  print(f"- {entry}")
              sys.exit(1)

          print("Secret pattern scan passed")
          PY

  test-nondocker:
    runs-on: ubuntu-latest
    needs: secret-pattern-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        working-directory: services/office-orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install finance-office dependencies
        working-directory: services/finance-office
        run: |
          pip install -r requirements.txt

      - name: Run unit and integration tests (no Docker)
        working-directory: services/office-orchestrator
        run: |
          python -m pytest tests -v -m "not docker" --tb=short

  release-gate:
    runs-on: ubuntu-latest
    needs:
      - secret-pattern-scan
      - test-nondocker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        working-directory: services/office-orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install finance-office dependencies
        working-directory: services/finance-office
        run: |
          pip install -r requirements.txt

      - name: Run release gate test set
        working-directory: services/office-orchestrator
        run: |
          python -m pytest tests/test_routing_and_dispatch.py -v --tb=short
          python -m pytest tests/test_security_and_observability.py -v --tb=short
          python -m pytest tests/test_http_endpoints_live.py -v --tb=short
          python -m pytest tests/test_local_process_smoke.py -v --tb=short
