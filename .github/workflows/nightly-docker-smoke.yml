name: Nightly Docker Smoke

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        working-directory: services/office-orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run docker smoke test (optional)
        working-directory: services/office-orchestrator
        env:
          RUN_DOCKER_SMOKE: "1"
        run: |
          python -m pytest tests/test_docker_compose_smoke.py -v --tb=short -rs
